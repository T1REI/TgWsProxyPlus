[package]
name = "tg-ws-proxy-plus"
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
authors = ["T1REI"]
description = "TgWsProxy+ (TgWsProxyPlus): compact Telegram MTProto WebSocket bridge"
license = "MIT"
repository = "https://github.com/T1REI/TgWsProxyPlus"
homepage = "https://github.com/T1REI/TgWsProxyPlus"
default-run = "TgWsProxyPlus"

[lib]
name = "tg_ws_proxy_plus"

[[bin]]
name = "TgWsProxyPlus"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:windows-sys"]

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
bytes = "1.12.1"
ctr = "0.10.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = { version = "0.4.3", features = ["std"] }
h2 = "0.4.20"
hmac = "0.13.0"
http = "1.5.0"
log = { version = "0.4.34", features = ["std"] }
native-tls = { version = "0.2.18", features = ["alpn"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-native-tls = "0.3.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
